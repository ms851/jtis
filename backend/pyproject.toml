[project]
name = "jtis-backend"
version = "0.0.0"
description = "JTIS — Judo Tournament Information System Backend"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing"
